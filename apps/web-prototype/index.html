const btn=(label,action,primary=false,extra='')=>`<button data-action="${action}" class="${primary?'primary':''}${action==='delete-data'?' danger':''}" ${extra.replace(/class="[^"]*"/g,'')}>${label}</button>`;
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3600);}
function modal(title,content,actions=''){const before=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="row"><h2 id="modal-title">${title}</h2><button class="small-button" id="close-modal" aria-label="Close dialog">Close</button></div><div class="divider"></div>${content}${actions}</div></div>`;$('#close-modal').onclick=()=>{$('#modal-root').innerHTML='';before?.focus();};$('#close-modal').focus();const d=$('.modal');d.onkeydown=e=>{if(e.key==='Escape')$('#close-modal').click();if(e.key==='Tab'){let f=[...d.querySelectorAll('button,input,a[href]')].filter(x=>!x.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}};}
const menu=[['overview','Overview','home'],['transcript','Transcript','file'],['gpa','GPA calculator','calc'],['plan','Degree plan','plan'],['masters','Master’s preparation','masters'],['advisor','AI advisor','chat'],['settings','Settings','settings']];
function nav(){const items=state.role==='operator'?[...menu,['admin','Sources','admin']]:menu;$('#nav').innerHTML=items.map(([id,label,ic])=>`<button data-go="${id}" class="${state.screen===id?'active':''}" ${state.screen===id?'aria-current="page"':''}>${icon(ic)}${label}</button>`).join('');$('#mobile-nav-root').innerHTML='<div class="mobile-navigation"><label for="mobile-section">Navigate to a section</label><select id="mobile-section" aria-label="Navigate to a section">'+items.map(([id,label])=>'<option value="'+id+'" '+(state.screen===id?'selected':'')+'>'+label+'</option>').join('')+'</select></div>';$('#mobile-section').onchange=e=>show(e.target.value);$('#crumb').textContent=(state.role==='operator'?'Operator demo':'Student workspace')+' / '+(items.find(i=>i[0]===state.screen)?.[1]||'Overview');}
function show(screen){state.screen=screen;render();window.scrollTo(0,0);}
function overview(){let s=stats();return head('Your studies, at a glance.','Know where you stand. Decide what comes next.',`<span class="badge purple">Profile PA-731 · revision ${state.revision}</span>`)+`<div class="grid stats"><section class="panel accent"><div class="stat-label">Credit-weighted GPA</div><div class="stat-value">${f(s.gpa)}</div><div class="mini">${s.credits} graded-attempt credits</div></section><section class="panel"><div class="stat-label">Earned credits</div><div class="stat-value">${s.earned}<span class="muted" style="font-size:18px"> / 40</span></div><div class="mini muted">Synthetic degree requirements</div><div class="progress" aria-label="${s.earned} of 40 demo credits earned"><span style="width:${Math.min(100,s.earned/40*100)}%"></span></div></section><section class="panel stat-wide"><div class="stat-label">Courses remaining</div><div class="stat-value">${remaining().length} <span class="muted" style="font-size:18px">courses</span></div><div class="mini muted">${remaining().map(c=>c.id).join(", ")} · ${remaining().reduce((n,c)=>n+c.credits,0)} credits</div></section></div><div class="grid cols2"><section class="panel next-steps"><div class="row"><h2>Your next steps</h2><span class="badge green">Confirmed record</span></div><div class="task"><span class="number">1</span><div><strong>Review your academic record</strong><p class="muted">Import a new transcript and confirm extracted fields.</p></div><button data-go="transcript" class="small-button">Review</button></div><div class="task"><span class="number">2</span><div><strong>Build your remaining course plan</strong><p class="muted">Check prerequisites, course availability and load.</p></div><button data-go="plan" class="small-button">Plan</button></div><div class="task"><span class="number">3</span><div><strong>Explore your masters options</strong><p class="muted">See requirements and prepare a personal checklist.</p></div><button data-go="masters" class="small-button">Explore</button></div></section><section class="panel goal-panel"><div class="eyebrow">A goal worth checking</div><h2>Can I reach GPA 3.00?</h2><p class="sub">Test a goal before making a plan.</p><div class="notice amber"><strong>${(s.points+60)/(s.credits+15)<3?"Not achievable in the sample scenario":"Target is within the sample score range"}</strong><br>With 15 more credits at 4.00, your maximum is ${f((s.points+60)/(s.credits+15))}.</div>${btn('Explore GPA scenarios','open-gpa',true)}<div class="tagline">Every result shows its inputs and calculation.</div></section></div><div class="tagline">All academic records and the 40-credit curriculum on this screen are fictional. No official AITU eligibility decision is shown.</div>`;}
function transcript(){let st=state.staging;let invalid=st?.some(c=>!Number.isFinite(c.credits)||c.credits<1||c.credits>60||!Number.isFinite(c.grade)||c.grade<0||c.grade>4);return head('Transcript and academic record','Review extracted information before it changes your profile.',`<span class="badge purple">Review before saving</span>`)+`<div class="grid ${st?'':'cols2'}"><section class="panel"><div class="row"><div><h2>${st?'Review extracted fields':'Import a transcript'}</h2><div class="sub">${st?'New import · staging only · active record unchanged':'Text-based PDF · up to 10 MB'}</div></div><span class="badge ${st?'amber':'green'}">${st?'Needs your confirmation':'Revision '+state.revision}</span></div>${st?`${notice(invalid?'Some fields are missing or outside their allowed range. Correct them before confirming.':'All required fields are filled. Check them against the transcript before confirming.',invalid?'amber':'green')}<div class="table-wrap"><table><thead><tr><th>Course</th><th>Credits</th><th>Grade point</th><th>Status</th></tr></thead><tbody>${st.map((c,i)=>`<tr><td><strong>${esc(c.name)}</strong></td><td><input aria-label="Credits for course ${c.id}" data-credit="${i}" inputmode="decimal" type="number" min="1" max="60" step=".5" value="${c.credits??''}" aria-invalid="${!c.credits}"></td><td><input aria-label="Grade point for course ${c.id}" data-grade="${i}" type="number" min="0" max="4" step=".01" value="${c.grade}"></td><td>${!c.credits?'<span class="badge red">Missing credits</span>':'<span class="badge green">Review value</span>'}</td></tr>`).join('')}</tbody></table></div><div id="import-error" class="error" role="alert">${invalid?'A required field is missing or outside its allowed range.':''}</div><label class="check-label"><input type="checkbox" id="review-check" ${state.review?'checked':''}>I have checked the course, credit and grade fields against my transcript.</label><div class="actions"><button class="primary" data-action="confirm-import" ${invalid||!state.review?'disabled':''}>Confirm and save record</button>${btn('Discard import','discard-import')}</div>`:`<div class="upload">${icon('file')}<h3>Choose a transcript PDF</h3><p class="mini muted">In this prototype, a selected file is not read or uploaded.<br>Use the sample to explore review and confirmation.</p><input id="file-input" type="file" accept="application/pdf,.pdf" aria-label="Choose a demo PDF"><div id="file-state" role="status"></div>${btn('Load sample transcript','load-sample',true)}</div><div class="table-wrap"><table><thead><tr><th>Confirmed course</th><th class="numeric">Credits</th><th class="numeric">Grade point</th></tr></thead><tbody>${state.courses.map(c=>`<tr><td>${esc(c.name)}</td><td class="numeric">${c.credits}</td><td class="numeric">${f(c.grade)}</td></tr>`).join('')}</tbody></table></div>`}</section>${st?'':`<aside class="panel"><h2>You stay in control</h2><div class="task"><span class="number">1</span><p>Select the supported file or load a sample.</p></div><div class="task"><span class="number">2</span><p>Correct any missing or misread fields.</p></div><div class="task"><span class="number">3</span><p>Confirm the values to create a new profile revision.</p></div>${notice('Scans, encrypted or unsupported PDFs need a manual-entry route in the final product.')}<button data-go="gpa">Enter current assessments</button></aside>`}</div>`;}
function gpa(){const s=stats(),valid=Number.isFinite(state.future)&&state.future>0&&Number.isFinite(state.target)&&state.target>=0&&state.target<=4;const required=valid?(state.target*(s.credits+state.future)-s.points)/state.future:NaN,max=valid?(s.points+4*state.future)/(s.credits+state.future):NaN;return head('GPA and target scores','Compare possibilities using the same confirmed academic record.',`<span class="badge purple">Revision ${state.revision}</span>`)+`<div class="grid cols2"><section class="panel"><h2>Cumulative GPA scenario</h2><div class="form-grid" style="margin-top:17px"><label class="field">Additional graded credits<input id="future" type="number" min="1" value="${state.future}"></label><label class="field">Target GPA<input id="target" type="number" min="0" max="4" step=".01" value="${state.target}"></label></div><div id="gpa-result">${gpaResult(s,valid,required,max)}</div><div class="actions">${btn('Show calculation','calc-source')}${btn('Save this scenario','save-gpa',true)}</div><div class="tagline">Sample policy: all graded attempts remain in GPA. A failed attempt contributes its credits and zero points. This is not an official AITU policy.</div></section><section class="panel"><h2>Current assessment target</h2><p class="sub">Demo weights: term 60% + final 40%.</p><div class="form-grid"><label class="field">Term score / 100<input id="term-score" type="number" min="0" max="100" value="${state.termScore}"></label><label class="field">Target total / 100<input id="score-target" type="number" min="0" max="100" value="${state.scoreTarget}"></label></div><div id="assessment-result">${assessmentResult()}</div></section></div><section class="panel" style="margin-top:18px"><div class="row"><h2>Saved grade scenarios</h2><span class="mini muted">Browser-local demo storage</span></div>${state.gpaScenarios.length?`<div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Extra credits</th><th>Target</th><th>Required average</th><th>Profile</th></tr></thead><tbody>${state.gpaScenarios.map((x,i)=>`<tr><td>Scenario ${i+1}</td><td>${x.future}</td><td>${f(x.target)}</td><td>${f(x.required)} ${x.required>4?'· unreachable':''}</td><td>Revision ${x.revision}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">Save a scenario to compare it later. Your confirmed grades will stay unchanged.</p>'}</section>`;}
function gpaResult(s,valid,r,max){if(!valid)return notice('Enter positive additional credits and a target GPA from 0.00 to 4.00.','red');return `<div class="notice ${r>4?'amber':'green'}"><strong>${r>4?'Target is not achievable':r<0?'Target is already secured under this scenario':'Target is within the score range'}</strong><br>${r>4?'The required average is above the maximum grade point of 4.00.':'This checks arithmetic feasibility; it does not predict future grades.'}</div><div class="row" style="margin:18px 0"><div><div class="stat-label">Current GPA</div><div class="stat-value">${f(s.gpa)}</div></div><div><div class="stat-label">Required average</div><div class="stat-value">${f(r)}</div></div><div><div class="stat-label">Maximum final GPA</div><div class="stat-value">${f(max)}</div></div></div><div class="formula">(${f(s.points)} + ${state.future} × x) / ${s.credits+state.future} = ${f(state.target)}<br>x = ${f(r)}</div>`;}
function assessmentResult(){let a=state.termScore,b=state.scoreTarget;if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||a>100||b<0||b>100)return notice('Both scores must be between 0 and 100.','red');let r=(b-.6*a)/.4;return `<div class="notice ${r>100?'amber':'green'}"><strong>${r>100?'Target is not achievable':'Required final score'}</strong><div style="font-size:29px;font-weight:750;margin:6px 0">${f(r)} / 100</div>${r>100?'Maximum total: '+f(.6*a+40):'Based on the entered term score and demo weights.'}</div>`;}
function validate(){const violations=[];let t=state.terms;for(const id of ['C','E','F'])if(!Number.isInteger(t[id])||t[id]<1||t[id]>3)violations.push(id+': choose trimester 1, 2 or 3.');if(t.C!==1)violations.push('Course C is offered only in trimester 1 in this demo.');if(t.E!==2)violations.push('Course E is offered only in trimester 2 in this demo.');if(t.C>=t.E)violations.push('Course E requires Course C to be completed in an earlier trimester.');for(let i=1;i<=3;i++){let load=Object.values(t).filter(x=>x===i).length*5;if(load>state.limit)violations.push('Trimester '+i+': '+load+' credits exceed the '+state.limit+'-credit limit.');}return{valid:!violations.length,violations,rule:state.rule,revision:state.revision};}
function plan(){if(state.courses.some((c,i)=>c.credits!==seed().courses[i].credits||c.grade!==seed().courses[i].grade))return head("Degree plan","Fixed planning fixture")+notice("This planning mockup supports the initial A–F sample only. Reset the demo after changing transcript values to explore planning.","amber")+btn("Restore sample record","reset",true);const result=state.planResult;return head('Build your degree plan','Resolve remaining requirements and compare valid course sequences.',`<span class="badge purple">Demo curriculum v${state.rule}</span>`)+`<div class="grid cols2"><section class="panel"><div class="row"><div><h2>Remaining courses</h2><p class="sub">25 of 40 earned credits · 15 credits outstanding</p></div><span class="badge amber">3 courses</span></div><div class="form-grid" style="margin:14px 0"><label class="field">Maximum credits per trimester<select id="load-limit"><option value="10" ${state.limit===10?'selected':''}>10 credits</option><option value="5" ${state.limit===5?'selected':''}>5 credits</option></select></label><div class="actions" style="align-items:end">${btn('Generate plan','generate-plan',true)}</div></div><div class="table-wrap"><table><thead><tr><th>Course and prerequisite</th><th>Credits</th><th>Trimester</th></tr></thead><tbody>${[['C','B already completed'],['E','C in an earlier trimester'],['F','A and B already completed']].map(([id,p])=>`<tr><td><strong>Course ${id}</strong><br><small class="muted">${p}</small></td><td>5</td><td><select data-term="${id}" aria-label="Trimester for course ${id}">${[1,2,3].map(i=>`<option value="${i}" ${state.terms[id]===i?'selected':''}>${i}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:16px">${btn('Validate plan','validate-plan',true)}${btn('Try an invalid plan','invalid-plan')}${btn('Save alternative','save-plan',false,result?.valid?'':'disabled')}</div><div id="plan-result">${result?result.valid?notice('<strong>Plan passes the demo checks.</strong><br>Prerequisites, availability and credit limits are satisfied.','green'):notice('<strong>Plan needs changes</strong><ul style="padding-left:18px;margin:7px 0 0">'+result.violations.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>','red'):notice('Run validation before saving this plan.')}</div></section><aside class="panel"><h2>Course sequence</h2><p class="sub">All elapsed trimesters stay visible.</p><div class="grid term-grid">${Array.from({length:Math.max(2,...Object.values(state.terms))},(_,j)=>j+1).map(i=>`<div class="trimester"><h3>Trimester ${i}</h3><div class="mini muted">${Object.values(state.terms).filter(x=>x===i).length*5} / ${state.limit} credits</div>${['C','E','F'].filter(id=>state.terms[id]===i).map(id=>`<div class="course"><strong>Course ${id}</strong>5 credits</div>`).join('')||'<div class="course muted">No courses</div>'}</div>`).join('')}</div><div class="tagline">C is offered in trimester 1, E in trimester 2, F in every trimester. Availability and rules are synthetic.</div></aside></div><section class="panel" style="margin-top:18px"><h2>Saved alternatives</h2>${state.plans.length?`<div class="table-wrap"><table><thead><tr><th>Alternative</th><th>Course terms C / E / F</th><th>Completion</th><th>Status</th></tr></thead><tbody>${state.plans.map((p,i)=>`<tr><td>Plan ${i+1}</td><td>${p.terms.C} / ${p.terms.E} / ${p.terms.F}</td><td>Trimester ${Math.max(...Object.values(p.terms))}</td><td><span class="badge ${p.rule===state.rule&&p.revision===state.revision?'green':'amber'}">${p.rule===state.rule&&p.revision===state.revision?'Validated snapshot':'Revalidation required'}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">Save two valid alternatives to compare their loads and completion terms.</p>'}</section>`;}
const programmes=[{id:'M01',title:'MSc Software Engineering',uni:'Example University North',field:'Software',min:3,deadline:'15 May 2027 · demo date'},{id:'M02',title:'MSc Data Science',uni:'Example University North',field:'Data',min:3.2,deadline:'Not supplied'},{id:'M03',title:'MSc Cybersecurity',uni:'Example University West',field:'Security',min:2.5,deadline:'Not supplied'},{id:'M04',title:'MSc Artificial Intelligence',uni:'Example University West',field:'Data',min:3,deadline:'1 June 2027 · demo date'},{id:'M05',title:'MSc Computer Science',uni:'Example University West',field:'Software',min:2.3,deadline:'Not supplied'}];
function masters(){let p=programmes.find(p=>p.id===state.programme)||programmes[0],s=stats(),items=programmes.filter(p=>(p.title+' '+p.uni).toLowerCase().includes(state.search.toLowerCase()));return head('Prepare for your next degree','Compare requirements, identify gaps and organise your preparation.',`<span class="badge amber">Fictional programme catalogue</span>`)+`<div class="grid equal"><section class="panel"><label class="field">Search demo programmes<input id="master-search" placeholder="Software, Data, Security…" value="${esc(state.search)}"></label><div style="margin-top:18px" id="programme-list">${programmeList(items)}</div></section><section class="panel"><div class="eyebrow">${p.id} · Demo intake 2027</div><h2>${p.title}</h2><p class="sub">${p.uni}</p><ul class="status-list"><li class="row"><span>GPA ≥ ${f(p.min)}<br><small class="muted">Your confirmed GPA: ${f(s.gpa)}</small></span><span class="badge ${s.gpa>=p.min?'green':'red'}">${s.gpa>=p.min?'Met':'Not met'}</span></li><li class="row"><span>Programming background<br><small class="muted">Courses A and B in the demo record</small></span><span class="badge green">Met</span></li><li class="row"><span>Completed bachelor degree</span><span class="badge amber">Pending graduation</span></li><li class="row"><span>Language evidence<br><small class="muted">No verified language score entered</small></span><span class="badge amber">Unknown</span></li></ul><div class="row mini"><strong>Application deadline</strong><span>${p.deadline}</span></div><div class="row mini" style="margin:9px 0 14px"><strong>Funding</strong><span class="muted">Not supplied</span></div><div class="actions">${btn('Inspect source','master-source')}${btn('Save preparation checklist','save-checklist',true)}</div><div class="divider"></div><h3>Preparation checklist</h3>${['Verify official programme requirements','Obtain language evidence','Confirm the deadline and funding options'].map((t,i)=>`<label class="check-label"><input type="checkbox" data-task="${p.id}-${i}" ${state.tasks[p.id+'-'+i]?'checked':''}>${t}</label>`).join('')}<div class="tagline">Matching shows demo conditions, not an admissions decision. No real university requirements or application links are supplied.</div></section></div>`;}
function programmeList(items){return items.length?items.map(p=>`<article class="program ${state.programme===p.id?'selected':''}"><span class="badge purple">${p.field}</span><h3>${p.title}</h3><p class="muted">${p.uni} · ${p.id}</p><button data-programme="${p.id}" class="small-button">${state.programme===p.id?'Selected programme':'Compare requirements'}</button></article>`).join(''):notice('No demo programme matches this search. Try Software, Data or Security.');}
function advisor(){return head('Ask your academic advisor','A conversation connected to your confirmed record and visible tool results.',`<span class="badge purple">Scripted interaction demo</span>`)+`<section class="panel"><div class="row"><h2>Academic conversation</h2><span class="badge green">Profile PA-731 · rev ${state.revision}</span></div><div class="chips">${[['gpa','How is my GPA calculated?'],['target','Can I reach GPA 3.00?'],['plan','What is left before graduation?'],['masters','What should I prepare for masters?']].map(([key,label])=>`<button data-ask="${key}">${label}</button>`).join('')}</div><div id="messages">${chatMessages()}</div><form id="chat-form" class="chat-input"><input id="chat-query" aria-label="Ask an academic question" placeholder="Ask about GPA, your plan or masters…"><button class="primary" type="submit">Send</button></form><div class="tagline">Prototype responses are scripted. No language model or external service is called. Tool steps illustrate the proposed interaction.</div></section>`;}
function chatMessages(){return state.chat.length?state.chat.map(x=>`<div class="message user">${esc(x.q)}</div><div class="message">${x.a}<details class="trace" open><summary>How this answer was produced</summary><ol>${x.steps.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><button class="small-button" data-action="calc-source">Inspect demo source</button></details></div>`).join(''):`<div class="message"><strong>What would you like to work on?</strong><p style="margin-top:8px">I can help you inspect a calculation, check remaining courses or prepare a masters checklist. Choose a sample question to see how the planned agent uses your profile.</p></div>`;}
function ask(kind,q){let s=stats(),a='',steps=['Load confirmed profile PA-731, revision '+state.revision+' (confirmed record).'];if(kind==='gpa'){a=`Your credit-weighted GPA is <strong>${f(s.gpa)}</strong>. The sample record contains ${s.credits} graded-attempt credits and ${f(s.points)} weighted points. The failed Course C contributes 5 credits and zero points under the demo policy.`;steps.push('Calculate '+f(s.points)+' / '+s.credits+' using the GPA calculator.','Return the numeric result and the demo grading-policy reference.');}else if(kind==='target'){let r=(3*(s.credits+15)-s.points)/15;a=`With 15 additional credits, GPA 3.00 requires an average of <strong>${f(r)}</strong>. ${r>4?'This exceeds the 4.00 maximum.':'This is within the permitted range.'} Your maximum would be <strong>${f((s.points+60)/(s.credits+15))}</strong>.`;steps.push('Calculate target feasibility with the target-score calculator.','Keep the confirmed record unchanged; explain the scenario separately.');}else if(kind==='plan'){a='The demo audit shows <strong>Courses C, E and F outstanding: 15 credits</strong>. Course C must precede E. Generate a plan and run validation before saving an alternative.';steps.push('Compare confirmed completions with demo curriculum v'+state.rule+' (degree audit).','Show unmet requirements and offer the planning screen.');}else if(kind==='masters'){a='Start with official programme requirements, language evidence and a deadline/funding check. The current catalogue is fictional, so its entries demonstrate the interface and cannot establish real eligibility.';steps.push('Load the selected demo programme and its source marker (programme evidence).','Separate met, unmet, conditional and unknown requirements.');}else{a='This prototype supports the sample GPA, target, degree-plan and masters questions above. Choose one of them to inspect the interaction. No live AI answer is generated.';steps.push('No supported scripted intent; request a sample scenario.');}state.chat.push({q,a,steps});if(state.chat.length>3)state.chat.shift();render();}
function settings(){return head('Profile and data settings','Manage your demo preferences and the record used in calculations.')+`<div class="grid equal"><section class="panel"><h2>Academic profile</h2><div class="form-grid" style="margin-top:16px"><label class="field">University<select id="profile-uni"><option>AITU</option></select></label><label class="field">Programme<select><option>Software Engineering · demo</option></select></label><label class="field">Year of study<input id="profile-year" type="number" min="1" max="6" value="${state.profile.year}"></label><label class="field">Intake<input value="Demo cohort" readonly></label></div><div class="actions" style="margin-top:16px">${btn('Save demo profile','save-profile',true)}${btn('Export demo data','export-data')}</div><div class="divider"></div><h3>Data control</h3><p class="sub">This prototype stores demo edits in this browser. No real account, transcript file or cloud profile is created.</p>${btn('Delete browser demo data','delete-data',false,'class="danger"')}</section><section class="panel"><h2>Prototype controls</h2><label class="field" style="margin:16px 0">Demonstration role<select id="demo-role"><option value="student" ${state.role==='student'?'selected':''}>Student</option><option value="operator" ${state.role==='operator'?'selected':''}>Operator · source administration</option></select></label><label class="field">Planned provider allowance<select id="allowance"><option value="free" ${state.allowance==='free'?'selected':''}>Free only · no paid fallback</option><option value="small" ${state.allowance==='small'?'selected':''}>Small allowance · confirmation required</option></select></label>${notice('No model calls are made in either setting. Role selection demonstrates proposed screens and is not authentication.')}<div class="actions">${btn('Reset all demo scenarios','reset')}</div></section></div>`;}
function admin(){if(state.role!=='operator')return notice('Switch to the operator demonstration role in Settings to inspect this screen.');return head('Sources and curriculum versions','Operator demonstration · review provenance before publishing changes.',`<span class="badge purple">UC12 · operator role</span>`)+`<section class="panel"><div class="row"><div><h2>Institutional source inventory</h2><p class="sub">Real coverage cannot be claimed from mock material.</p></div><span class="badge amber">AITU coverage incomplete</span></div><div class="table-wrap"><table><thead><tr><th>Source</th><th>Version</th><th>Provenance</th><th>Status</th></tr></thead><tbody><tr><td>SE demonstration curriculum</td><td>${state.rule}</td><td>Synthetic</td><td><span class="badge green">Demo active</span></td></tr><tr><td>Official AITU programme/cohort inventory</td><td>Not supplied</td><td>Official documents needed</td><td><span class="badge amber">Missing</span></td></tr><tr><td>Second-university programme</td><td>Not supplied</td><td>Official documents needed</td><td><span class="badge amber">Missing</span></td></tr><tr><td>Masters programme catalogue</td><td>Demo 1.0</td><td>Fictional programme briefs</td><td><span class="badge purple">Prototype only</span></td></tr></tbody></table></div><div class="notice amber">Publishing a demo version makes earlier saved plans stale. The student must revalidate them against the new version.</div><div class="actions">${btn('Publish next demo version','publish-rule',true)}${btn('Inspect provenance','curriculum-source')}</div></section>`;}
function render(){nav();let views={overview,transcript,gpa,plan,masters,advisor,settings,admin};$('#main').innerHTML=(views[state.screen]||overview)();bindFields();persist();}
function bindFields(){if($('#review-check'))$('#review-check').onchange=e=>{state.review=e.target.checked;render();};document.querySelectorAll('[data-credit]').forEach(el=>el.onchange=e=>{let v=e.target.value;state.staging[+el.dataset.credit].credits=v===''?null:Number(v);render();});document.querySelectorAll('[data-grade]').forEach(el=>el.onchange=e=>{let v=e.target.value;state.staging[+el.dataset.grade].grade=v===''?null:Number(v);render();});if($('#file-input'))$('#file-input').onchange=e=>{const file=e.target.files[0];if(!file)return;const msg=!file.name.toLowerCase().endsWith('.pdf')?'Unsupported file. Choose a text-based PDF.':file.size>10*1024*1024?'File exceeds 10 MB. Choose a smaller PDF.':'File selected for demonstration only. It was not read or uploaded. Load the sample to continue.';$('#file-state').innerHTML=notice(esc(msg),file.size>10*1024*1024||!file.name.toLowerCase().endsWith('.pdf')?'red':'');};for(const [id,key] of [['future','future'],['target','target'],['term-score','termScore'],['score-target','scoreTarget']]){if($('#'+id))$('#'+id).oninput=e=>{state[key]=e.target.value===''?NaN:Number(e.target.value);let s=stats(),v=Number.isFinite(state.future)&&state.future>0&&Number.isFinite(state.target)&&state.target>=0&&state.target<=4;if($('#gpa-result'))$('#gpa-result').innerHTML=gpaResult(s,v,v?(state.target*(s.credits+state.future)-s.points)/state.future:NaN,v?(s.points+4*state.future)/(s.credits+state.future):NaN);if($('#assessment-result'))$('#assessment-result').innerHTML=assessmentResult();persist();};}if($('#load-limit'))$('#load-limit').onchange=e=>{state.limit=+e.target.value;state.planResult=null;render();};document.querySelectorAll('[data-term]').forEach(el=>el.onchange=e=>{state.terms[el.dataset.term]=+e.target.value;state.planResult=null;render();});if($('#master-search'))$('#master-search').oninput=e=>{state.search=e.target.value;$('#programme-list').innerHTML=programmeList(programmes.filter(p=>(p.title+' '+p.uni).toLowerCase().includes(state.search.toLowerCase())));};if($('#demo-role'))$('#demo-role').onchange=e=>{state.role=e.target.value;render();toast('Demo role changed. This is not a real login.');};if($('#allowance'))$('#allowance').onchange=e=>{state.allowance=e.target.value;persist();toast('Demo provider preference saved. No API calls are made.');};document.querySelectorAll('[data-task]').forEach(el=>el.onchange=e=>{state.tasks[el.dataset.task]=e.target.checked;persist();});if($('#chat-form'))$('#chat-form').onsubmit=e=>{e.preventDefault();let q=$('#chat-query').value.trim();if(!q)return;let k=/3\.00|reach|target/i.test(q)?'target':/gpa|average/i.test(q)?'gpa':/plan|graduat|course/i.test(q)?'plan':/master/i.test(q)?'masters':'unknown';ask(k,q);};}
document.addEventListener('click',e=>{let go=e.target.closest('[data-go]');if(go){show(go.dataset.go);return;}let pr=e.target.closest('[data-programme]');if(pr){state.programme=pr.dataset.programme;render();return;}let aq=e.target.closest('[data-ask]');if(aq){ask(aq.dataset.ask,aq.textContent);return;}let ac=e.target.closest('[data-action]');if(!ac)return;let a=ac.dataset.action;if(a==='open-gpa')show('gpa');if(a==='load-sample'){state.staging=state.courses.map(c=>({...c}));state.staging[1].credits=null;state.review=false;render();}if(a==='discard-import'){state.staging=null;state.review=false;render();toast('Import discarded. Active record unchanged.');}if(a==='confirm-import'){if(!state.review||!state.staging||state.staging.some(c=>!Number.isFinite(c.credits)||c.credits<1||c.credits>60||!Number.isFinite(c.grade)||c.grade<0||c.grade>4))return;state.courses=state.staging.map(c=>({...c}));state.staging=null;state.review=false;state.revision++;state.planResult=null;render();toast('Confirmed record saved as revision '+state.revision+'.');}if(a==='save-gpa'){let s=stats();if(!Number.isFinite(state.future)||state.future<=0||!Number.isFinite(state.target)||state.target<0||state.target>4){toast('Correct the scenario inputs before saving.');return;}state.gpaScenarios.push({future:state.future,target:state.target,required:(state.target*(s.credits+state.future)-s.points)/state.future,revision:state.revision});render();toast('Grade scenario saved. Confirmed grades unchanged.');}if(a==='generate-plan'){state.terms=state.limit===5?{C:1,E:2,F:3}:{C:1,E:2,F:1};state.planResult=validate();render();toast('Demo candidate generated and checked.');}if(a==='validate-plan'){state.planResult=validate();render();}if(a==='invalid-plan'){state.terms={C:1,E:1,F:2};state.planResult=validate();render();}if(a==='save-plan'){const r=validate();if(!r.valid){state.planResult=r;render();return;}state.plans.push({terms:{...state.terms},limit:state.limit,revision:state.revision,rule:state.rule});render();toast('Alternative saved with its profile and rule versions.');}if(a==='calc-source')modal('Calculation source and inputs',`<span class="badge purple">Synthetic policy · sample policy</span><p style="margin-top:14px">GPA = Σ(credits × grade point) / Σ(graded-attempt credits).</p><div class="formula">Weighted points: ${f(stats().points)}<br>Graded-attempt credits: ${stats().credits}<br>GPA: ${f(stats().gpa)}<br>Profile revision: ${state.revision}</div><p style="margin-top:14px">All attempts are retained in this sample. No official AITU grading or repeat policy has been loaded.</p>`);if(a==='master-source')modal('Programme evidence',`<span class="badge amber">Fictional programme brief · ${state.programme}</span><p style="margin-top:14px">This source is a UX fixture. Its programme, requirements and dates are fictional. No official URL is available in the prototype.</p><p>The final product must show the official programme page, intake, retrieval date and the passage supporting each requirement. Missing information must remain unknown.</p>`);if(a==='save-checklist'){state.tasks[state.programme+'-saved']=true;persist();toast('Checklist saved locally for '+state.programme+'.');}if(a==='save-profile'){let v=Number($('#profile-year').value);if(!Number.isInteger(v)||v<1||v>6){toast('Enter a year from 1 to 6.');return;}state.profile.year=v;state.revision++;state.planResult=null;render();toast('Demo profile saved as revision '+state.revision+'.');}if(a==='export-data'){let data={prototype:true,synthetic:true,profile:state.profile,courses:state.courses,revision:state.revision,plans:state.plans,scenarios:state.gpaScenarios,checklist:state.tasks};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let l=document.createElement('a');l.href=url;l.download='academic-planner-demo.json';l.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Synthetic demo data exported.');}if(a==='delete-data')modal('Delete browser demo data?',`<p>This removes the synthetic profile edits, saved scenarios and checklists from this browser. No university records exist in this prototype.</p>`,`<button class="danger" id="confirm-delete">Delete demo data</button>`);if(a==='reset'){state=seed();persist();render();toast('Demo reset.');}if(a==='publish-rule'&&state.role==='operator'){state.rule='1.'+(Number(state.rule.split('.')[1])+1);state.planResult=null;render();toast('Demo v'+state.rule+' published. Existing plans require revalidation.');}if(a==='curriculum-source')modal('Curriculum provenance',`<span class="badge purple">Synthetic curriculum v${state.rule}</span><p style="margin-top:14px">40 earned credits: A 5, B 10, C 5, D 10, E 5, F 5. C requires B; E requires prior C; F requires A and B.</p><p>C is offered in trimester 1; E in trimester 2; F in every trimester. These are demo rules. Official AITU and second-university sources are missing.</p>`);});
document.addEventListener('click',e=>{if(e.target.id==='confirm-delete'){try{localStorage.removeItem('medina-ux-v1');}catch(e){}state=seed();$('#modal-root').innerHTML='';render();toast('Stored demo edits deleted. The default synthetic fixture is displayed.');}});
$('#reset-demo').onclick=()=>{state=seed();persist();render();toast('Demo reset.');};window.uxDemo={reset:()=>{state=seed();render();},show,read:()=>JSON.parse(JSON.stringify(state))};render();
})();
</script></body></html>
